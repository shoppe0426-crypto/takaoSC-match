<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高尾SC 試合結果速報ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>TAKAO SC</h1>
        <p>Match Result Bulletin</p>
    </header>

    <!-- 新しい試合の登録 -->
    <div class="card">
        <h2>📝 新しい試合の登録</h2>
        <button class="btn btn-cancel" id="btn-cancel-edit">編集を中止</button>
        
        <div class="form-group">
            <label for="match-date">試合日</label>
            <input type="date" id="match-date">
        </div>

        <div class="form-group">
            <label>試合の種類</label>
            <div class="radio-group">
                <label><input type="radio" name="match-type" value="tm" checked> トレーニングマッチ</label>
                <label><input type="radio" name="match-type" value="invitation"> 招待試合</label>
                <label><input type="radio" name="match-type" value="tournament"> 大会</label>
            </div>
        </div>

        <!-- 大会名・試合名入力枠 -->
        <div class="form-group hidden" id="tournament-name-group">
            <label for="tournament-name">大会名・試合名</label>
            <input type="text" id="tournament-name" placeholder="例：〇〇カップ、春季大会">
        </div>

        <div class="match-vs">
            <div class="team-box">
                <div class="team-name">高尾SC</div>
                <input type="number" class="score-input" id="score-home" value="0" min="0" readonly>
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <input type="text" id="opponent-name" placeholder="対戦相手チーム" style="margin-bottom:5px; text-align:center;">
                <input type="number" class="score-input" id="score-away" value="0" min="0">
            </div>
        </div>

        <div class="form-group">
            <label>⚽ 高尾SC 得点者と個人得点 (総得点に自動加算)</label>
            <div id="scorer-container">
                <!-- JavaScriptで初期枠が生成されます -->
            </div>
            <button class="btn btn-outline" id="btn-add-scorer" type="button" style="padding: 8px 15px; font-size: 14px; width: auto; margin-top: 5px;">＋ 得点者の入力枠を追加する (最大10枠)</button>
        </div>

        <div class="form-group">
            <label for="gk-name">🧤 GK (ゴールキーパー)</label>
            <input type="text" id="gk-name" placeholder="GKの選手名">
        </div>

        <button class="btn" id="btn-add-match" type="button">＋ 試合結果を追加する</button>
    </div>

    <!-- 全試合結果一覧 -->
    <div class="card">
        <h2>📊 全試合結果一覧</h2>
        <div class="form-group">
            <label for="date-index">📅 日付インデックス</label>
            <select id="date-index">
                <option value="all">すべて表示</option>
            </select>
        </div>
        <div id="match-list">
            <p style="color:#9ca3af; text-align:center;" id="empty-message">登録された試合はありません。</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

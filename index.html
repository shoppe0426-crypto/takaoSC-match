<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカー スコアトラッカー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .team {
            flex: 1;
        }
        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 10px;
        }
        .score {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2e7d32;
            margin: 10px 0;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.btn-minus {
            background-color: #e53935;
        }
        button.btn-minus:hover {
            background-color: #d32f2f;
        }
        .vs {
            font-size: 1.5rem;
            color: #7f8c8d;
            font-weight: bold;
            padding: 0 20px;
        }
        .controls {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        button.btn-reset {
            background-color: #7f8c8d;
        }
        button.btn-reset:hover {
            background-color: #707b7c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>サッカースコア</h1>
    
    <div class="scoreboard">
        <div class="team">
            <div class="team-name">自チーム</div>
            <div class="score" id="score-home">0</div>
            <button onclick="changeScore('home', 1)">+ 得点</button>
            <br>
            <button class="btn-minus" onclick="changeScore('home', -1)">- 戻す</button>
        </div>
        
        <div class="vs">VS</div>
        
        <div class="team">
            <div class="team-name">相手チーム</div>
            <div class="score" id="score-away">0</div>
            <button onclick="changeScore('away', 1)">+ 得点</button>
            <br>
            <button class="btn-minus" onclick="changeScore('away', -1)">- 戻す</button>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn-reset" onclick="resetScore()">スコアをリセット</button>
    </div>
</div>

<script>
    let scores = {
        home: 0,
        away: 0
    };

    function changeScore(team, value) {
        scores[team] += value;
        if (scores[team] < 0) scores[team] = 0;
        document.getElementById(`score-${team}`).innerText = scores[team];
    }

    function resetScore() {
        if(confirm('スコアをリセットしますか？')) {
            scores.home = 0;
            scores.away = 0;
            document.getElementById('score-home').innerText = 0;
            document.getElementById('score-away').innerText = 0;
        }
    }
</script>

</body>
</html>

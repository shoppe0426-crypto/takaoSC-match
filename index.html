<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高尾SC 試合結果速報ツール</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>body { background-color: #0b132b; color: #f8fafc; } ::placeholder { color: #64748b !important; opacity: 1; }</style>
</head>
<body class="p-4 font-sans max-w-md mx-auto">
    <div class="text-center my-6">
        <h1 class="text-2xl font-black tracking-wider text-amber-400 drop-shadow-md">TAKAO SC</h1>
        <p class="text-[11px] uppercase tracking-widest text-slate-400 font-bold mt-1">Match Result Bulletin</p>
    </div>
    <div class="bg-[#1c2541] rounded-2xl p-5 mb-6 shadow-2xl border border-slate-700/50">
        <div class="flex items-center gap-2 mb-4 border-b border-slate-700/60 pb-2">
            <span class="text-lg">📝</span>
            <h2 id="formTitle" class="font-extrabold text-sm text-slate-200">新しい試合の登録</h2>
            <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden ml-auto text-[10px] text-slate-400 border border-slate-600 px-2 py-0.5 rounded bg-slate-800">編集を中止</button>
        </div>
        <div class="space-y-4 text-xs">
            <input type="hidden" id="editingMatchId" value="">
            <div>
                <label class="block text-slate-400 mb-1 font-bold">試合日</label>
                <input type="date" id="matchDate" class="w-full p-2.5 bg-[#0f172a] border border-slate-600 rounded-lg text-white font-bold focus:outline-none focus:border-amber-400 text-sm">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-bold">試合の種類</label>
                <select id="matchType" onchange="toggleTournamentInput()" class="w-full p-2.5 bg-[#0f172a] border border-slate-600 rounded-lg text-white font-bold focus:outline-none focus:border-amber-400 text-sm">
                    <option value="トレーニングマッチ">トレーニングマッチ</option>
                    <option value="招待試合">招待試合</option>
                    <option value="大会">大会</option>
                </select>
            </div>
            <div id="tournamentNameContainer" class="hidden">
                <label id="tournamentLabel" class="block text-slate-400 mb-1 font-bold">大会名・試合名</label>
                <input type="text" id="tournamentName" placeholder="例：〇〇招待、〇〇カップ" class="w-full p-2.5 bg-[#0f172a] border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-400 placeholder-slate-500 text-sm">
            </div>
            <div class="bg-[#111a36] p-4 rounded-xl border border-slate-800 flex items-center justify-between gap-3 shadow-inner">
                <div class="w-2/5 text-center">
                    <span class="block font-black text-sm text-sky-400 tracking-wide mb-1.5">高尾SC</span>
                    <input type="number" id="scoreTakao" value="0" readonly class="w-16 p-2 text-center bg-[#1e293b] border border-slate-700 rounded-lg font-black text-xl text-amber-400 focus:outline-none">
                </div>
                <div class="text-slate-500 font-black text-xs tracking-tighter mt-4">VS</div>
                <div class="w-2/5 text-center">
                    <input type="text" id="opponentName" placeholder="相手チーム名" class="w-full p-1.5 text-center bg-[#0f172a] border border-slate-600 rounded-md text-white font-bold text-xs focus:outline-none focus:border-amber-400 placeholder-slate-500">
                    <input type="number" id="scoreOpponent" placeholder="0" class="w-16 p-2 mt-1.5 text-center bg-[#0f172a] border border-slate-600 rounded-lg font-black text-xl text-white focus:outline-none focus:border-amber-400">
                </div>
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-bold">⚽ 高尾SC 得点者と個人得点 (総得点に自動加算)</label>
                <div id="scorerContainer" class="space-y-2">
                    <div class="flex gap-2 scorer-row">
                        <input type="text" placeholder="名前" class="w-2/3 p-2 bg-[#0f172a] border border-slate-700 rounded-lg text-white focus:outline-none scorer-name text-xs">
                        <input type="number" placeholder="点数" min="0" oninput="updateTotalScore()" class="w-1/3 p-2 text-center bg-[#0f172a] border border-slate-700 rounded-lg text-white font-bold focus:outline-none scorer-points text-xs">
                    </div>
                    <div class="flex gap-2 scorer-row">
                        <input type="text" placeholder="名前" class="w-2/3 p-2 bg-[#0f172a] border border-slate-700 rounded-lg text-white focus:outline-none scorer-name text-xs">
                        <input type="number" placeholder="点数" min="0" oninput="updateTotalScore()" class="w-1/3 p-2 text-center bg-[#0f172a] border border-slate-700 rounded-lg text-white font-bold focus:outline-none scorer-points text-xs">
                    </div>
                    <div class="flex gap-2 scorer-row">
                        <input type="text" placeholder="名前" class="w-2/3 p-2 bg-[#0f172a] border border-slate-700 rounded-lg text-white focus:outline-none scorer-name text-xs">
                        <input type="number" placeholder="点数" min="0" oninput="updateTotalScore()" class="w-1/3 p-2 text-center bg-[#0f172a] border border-slate-700 rounded-lg text-white font-bold focus:outline-none scorer-points text-xs">
                    </div>
                </div>
                <button type="button" onclick="addScorerField()" class="mt-2.5 text-[11px] text-sky-400 font-bold hover:underline block">＋ 得点者の入力枠を追加する (最大10枠)</button>
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-bold">🧤 GK (ゴールキーパー)</label>
                <input type="text" id="goalkeeper" placeholder="例：ツバサ(前半)、リク(後半)" class="w-full p-2.5 bg-[#0f172a] border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-400 placeholder-slate-500">
            </div>
            <button id="submitBtn" onclick="saveMatch()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-[#0b132b] font-black rounded-xl shadow-lg text-sm tracking-wider uppercase">＋ 試合結果を追加する</button>
        </div>
    </div>
    <div class="mb-6 bg-[#1c2541]/40 rounded-xl p-4 border border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wildest px-1">📅 日付インデックス</label>
            <select id="yearSelector" onchange="changeYear()" class="bg-[#0f172a] text-xs font-bold text-amber-400 border border-slate-700 rounded px-2 py-1 focus:outline-none"></select>
        </div>
        <div id="dateFilters" class="flex flex-wrap gap-1.5 text-xs"></div>
    </div>
    <div class="flex justify-between items-end mb-4 px-1">
        <div class="flex items-center gap-2"><span class="text-base">📊</span><h2 id="timelineHeaderTitle" class="text-base font-black text-slate-200">全試合結果一覧</h2></div>
    </div>
    <div id="matchTimeline" class="space-y-4 mb-16"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDoLQhgpQKKq8ogVlA_EFaOmt",
            authDomain: "://firebaseapp.com",
            projectId: "takao-sc-match",
            storageBucket: "takao-sc-match.firebasestorage.app",
            messagingSenderId: "1032352956906",
            appId: "1:1032352956906:web:310dfa13812",
            measurementId: "G-GTX64FCQ2B"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();
        let currentFilterMode = "all", currentFilterValue = "all", allMatches = [], currentSelectedYear = new Date().getFullYear();
        window.onload = function() {
            initDateInput(); initYearSelector();
            db.collection("matches").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                allMatches = [];
                snapshot.forEach((doc) => { if (doc.data().rawDate) { allMatches.push({ id: doc.id, ...doc.data() }); } });
                calculateMatchNumbers(); displayMatches();
            });
        }
        function initDateInput() { const today = new Date(); document.getElementById('matchDate').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`; }
        function initYearSelector() {
            const currentYear = new Date().getFullYear(); const selector = document.getElementById('yearSelector'); selector.innerHTML = '';
            for (let y = currentYear; y >= currentYear - 2; y--) { const option = document.createElement('option'); option.value = y; option.innerText = `${y}年度`; selector.appendChild(option); }
            currentSelectedYear = parseInt(selector.value);
        }
        function toggleTournamentInput() {
            const type = document.getElementById('matchType').value, container = document.getElementById('tournamentNameContainer'), label = document.getElementById('tournamentLabel');
            if (type === "招待試合" || type === "大会") { container.classList.remove('hidden'); label.innerText = type === "招待試合" ? "招待試合名" : "大会名・公式戦名"; }
            else { container.classList.add('hidden'); document.getElementById('tournamentName').value = ""; }
        }
        function changeYear() { currentSelectedYear = parseInt(document.getElementById('yearSelector').value); currentFilterMode = "all"; currentFilterValue = "all"; displayMatches(); }
        function initScorerFields() { const container = document.getElementById('scorerContainer'); container.innerHTML = ''; for (let i = 0; i < 3; i++) { addScorerField(); } }
        function addScorerField() {
const container = document.getElementById('scorerContainer'); if (container.getElementsByClassName('scorer-row').length >= 10) return;
const div = document.createElement('div'); div.className = 'flex gap-2 scorer-row';
div.innerHTML = <input type="text" placeholder="名前" class="w-2/3 p-2 bg-[#0f172a] border border-slate-700 rounded-lg text-white focus:outline-none scorer-name text-xs"><input type="number" placeholder="点数" min="0" oninput="updateTotalScore()" class="w-1/3 p-2 text-center bg-[#0f172a] border border-slate-700 rounded-lg text-white font-bold focus:outline-none scorer-points text-xs">;
container.appendChild(div);
}
function updateTotalScore() { const pointsFields = document.getElementsByClassName('scorer-points'); let total = 0; for (let i = 0; i < pointsFields.length; i++) { const val = parseInt(pointsFields[i].value); if (!isNaN(val) && val > 0) { total += val; } } document.getElementById('scoreTakao').value = total; }
function getScorersTextAndSummary() {
const rows = document.getElementsByClassName('scorer-row'); let summaryArray = [];
for (let i = 0; i < rows.length; i++) {
const name = rows[i].querySelector('.scorer-name').value.trim(), points = parseInt(rows[i].querySelector('.scorer-points').value);
if (name && !isNaN(points) && points > 0) { summaryArray.push(${name}${points > 1 ? points : ''}); } else if (name) { summaryArray.push(name); }
}
return summaryArray.join('、') || "ー";
}
function setScorersFieldsFromText(scorersText) {
const container = document.getElementById('scorerContainer'); container.innerHTML = ''; if (!scorersText || scorersText === "ー") { initScorerFields(); return; }
const items = scorersText.split('、');
while (container.getElementsByClassName('scorer-row').length < items.length && container.getElementsByClassName('scorer-row').length < 10) { addScorerField(); }
while (container.getElementsByClassName('scorer-row').length < 3) { addScorerField(); }
const rows = container.getElementsByClassName('scorer-row');
items.forEach((item, idx) => {
if (idx >= rows.length) return; const match = item.match(/^(.+?)(\d+)$/);
if (match) { rows[idx].querySelector('.scorer-name').value = match[1]; rows[idx].querySelector('.scorer-points').value = match[2]; }
else { rows[idx].querySelector('.scorer-name').value = item; rows[idx].querySelector('.scorer-points').value = ""; }
});
updateTotalScore();
}
function calculateMatchNumbers() {
const chronoMatches = [...allMatches].sort((a, b) => a.timestamp - b.timestamp), dateOpponentCounts = {};
chronoMatches.forEach(m => { const key = ${m.rawDate}_${m.opponent}; if (!dateOpponentCounts[key]) { dateOpponentCounts[key] = []; } dateOpponentCounts[key].push(m); });
Object.keys(dateOpponentCounts).forEach(key => {
const list = dateOpponentCounts[key];
list.forEach((m, index) => { const original = allMatches.find(x => x.id === m.id); if (original) { original.matchNumberText = list.length > 1 ? ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"][index] || "" : ""; } });
});
}
function getFiscalYear(dateStr) { const d = new Date(dateStr); return (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1; }
function saveMatch() {
const idInput = document.getElementById('editingMatchId').value, date = document.getElementById('matchDate').value, scoreTakao = document.getElementById('scoreTakao').value, opponent = document.getElementById('opponentName').value.trim(), scoreOpponent = document.getElementById('scoreOpponent').value, goalkeeper = document.getElementById('goalkeeper').value.trim(), matchType = document.getElementById('matchType').value, tournamentName = document.getElementById('tournamentName').value.trim(), scorersText = getScorersTextAndSummary();
if (!date || scoreTakao === "" || !opponent || scoreOpponent === "") { alert("試合日、相手チーム名、スコアは必須項目です。"); return; }
const matchData = { date: formatDate(date), rawDate: date, scoreTakao: parseInt(scoreTakao), opponent: opponent, scoreOpponent: parseInt(scoreOpponent), scorers: scorersText, gk: goalkeeper || "ー", matchType: matchType, tournamentName: (matchType === "招待試合" || matchType === "大会") ? tournamentName || "名称未入力" : "", timestamp: idInput ? parseInt(idInput) : Date.now() };
if (idInput) { db.collection("matches").doc(idInput).set(matchData).then(() => { cancelEdit(); }); }
else {
db.collection("matches").doc(String(matchData.timestamp)).set(matchData).then(() => {
document.getElementById('scoreTakao').value = "0"; document.getElementById('opponentName').value = ""; document.getElementById('scoreOpponent').value = "0"; document.getElementById('goalkeeper').value = ""; document.getElementById('tournamentName').value = ""; document.getElementById('matchType').value = "トレーニングマッチ"; toggleTournamentInput(); initScorerFields();
});
}
}
function displayMatches() {
const yearMatches = allMatches.filter(m => getFiscalYear(m.rawDate) === currentSelectedYear); updateDateFilters(yearMatches);
const timeline = document.getElementById('matchTimeline'); timeline.innerHTML = ''; let filteredMatches = yearMatches;
if (currentFilterMode === "date") { filteredMatches = yearMatches.filter(m => m.rawDate === currentFilterValue); }
else if (currentFilterMode === "month") { filteredMatches = yearMatches.filter(m => m.rawDate.substring(0, 7) === currentFilterValue); }
const headerTitle = document.getElementById('timelineHeaderTitle'); headerTitle.innerText = currentFilterMode === "all" ? ${currentSelectedYear}年度 全試合結果一覧 : currentFilterMode === "date" ? ${yearMatches.find(m => m.rawDate === currentFilterValue)?.date || ''} の試合結果 : ${parseInt(currentFilterValue.split('-').pop())}月 の試合結果;
if (filteredMatches.length === 0) { timeline.innerHTML = <div class="text-center py-10 bg-[#1c2541]/20 rounded-2xl border border-dashed border-slate-700/60"><p class="text-xs text-slate-500 font-bold">登録された試合結果はありません。</p></div>; return; }
filteredMatches.forEach(m => {
let resultText = "DRAW", resultClass = "bg-slate-600 text-slate-100 border border-slate-500/30";
if (m.scoreTakao > m.scoreOpponent) { resultText = "WIN"; resultClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30"; }
else if (m.scoreTakao < m.scoreOpponent) { resultText = "LOSE"; resultClass = "bg-rose-500/10 text-rose-400 border border-rose-500/30"; }
const typeLabel = m.matchType ? (m.tournamentName ? ${m.matchType} (${m.tournamentName}) : m.matchType) : "トレーニングマッチ";
const matchHtml =  <div class="bg-[#1c2541] rounded-2xl shadow-xl border border-slate-700/40 overflow-hidden text-xs relative"> <div class="bg-[#111a36] px-4 py-2.5 flex justify-between items-center border-b border-slate-700/30"> <div class="flex flex-col items-start gap-0.5"><span class="font-extrabold text-slate-300 tracking-wide">${m.date}</span><span class="text-[9px] font-bold text-amber-400/80">${typeLabel}</span></div> <div class="flex items-center gap-3"><span class="px-2 py-0.5 rounded text-[9px] font-black tracking-wider ${resultClass}">${resultText}</span><button onclick="deleteMatch('${m.id}')" class="text-slate-500 hover:text-red-400 text-sm font-bold pl-1 font-mono">×</button></div> </div> <div class="p-4 flex justify-between items-center bg-[#152244]/20 border-b border-slate-700/20"> <div class="w-2/5 text-right font-black text-sm text-sky-400 truncate pr-1">高尾SC</div> <div class="w-1/5 text-center font-black text-lg bg-[#0f172a] py-1 rounded-xl border border-slate-700/60 text-amber-400 shadow-inner px-2 tracking-tighter">${m.scoreTakao}-${m.scoreOpponent}</div> <div class="w-2/5 text-left font-black text-sm text-slate-200 truncate pl-1">${m.opponent}${m.matchNumberText || ''}</div> </div> <div class="p-4 space-y-2 bg-[#1a233d]/20 text-slate-300 border-t border-slate-700/10 flex justify-between items-end"> <div class="space-y-2 flex-1"> <div class="flex items-start gap-2"><span class="font-bold text-amber-400/90 w-14 shrink-0">⚽ 得点者:</span><span class="text-slate-200 font-medium">${m.scorers}</span></div> <div class="flex items-start gap-2"><span class="font-bold text-sky-400/90 w-14 shrink-0">🧤 GK:</span><span class="text-slate-200 font-medium">${m.gk}</span></div> </div> <button onclick="editMatch('${m.id}')" class="text-[10px] text-amber-400/80 font-bold border border-amber-500/20 px-2 py-1 rounded bg-amber-500/5 hover:bg-amber-500/20 tracking-wider shrink-0 ml-2">✏️ 編集</button> </div> </div>; timeline.innerHTML += matchHtml;
});
    }
function updateDateFilters(yearMatches) {
const filterContainer = document.getElementById('dateFilters'); filterContainer.innerHTML = '';
const allBtnClass = currentFilterMode === "all" ? "bg-amber-500 text-[#0b132b] font-black" : "bg-[#0f172a] text-slate-300 border border-slate-700";
filterContainer.innerHTML += <button onclick="filterBy('all', 'all')" class="px-2.5 py-1 rounded-md font-bold transition-all text-[11px] ${allBtnClass}">全件</button>;
const today = new Date(); const currentYearMonth = ${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')};
const dateMap = {}, monthMap = {};
yearMatches.forEach(m => { const ym = m.rawDate.substring(0, 7); if (ym === currentYearMonth) { dateMap[m.rawDate] = m.date.replace(/ .+/, ''); } else { monthMap[ym] = ${parseInt(ym.split('-').pop())}月; } });
Object.keys(dateMap).sort((a, b) => b.localeCompare(a)).forEach(d => { const btnClass = (currentFilterMode === "date" && currentFilterValue === d) ? "bg-amber-500 text-[#0b132b] font-black" : "bg-[#0f172a] text-slate-300 border border-slate-700"; filterContainer.innerHTML += <button onclick="filterBy('date', '${d}')" class="px-2.5 py-1 rounded-md font-bold transition-all text-[11px] ${btnClass}">${dateMap[d]}</button>; });
                                                                Object.keys(monthMap).sort((a, b) => b.localeCompare(a)).forEach(m => { const btnClass = (currentFilterMode === "month" && currentFilterValue === m) ? "bg-amber-500 text-[#0b132b] font-black" : "bg-[#0f172a] text-slate-300 border border-slate-700"; filterContainer.innerHTML += <button onclick="filterBy('month', '${m}')" class="px-2.5 py-1 rounded-md font-bold transition-all text-[11px] ${btnClass}">${monthMap[m]}</button>; });
}
function filterBy(mode, value) { currentFilterMode = mode; currentFilterValue = value; displayMatches(); }
function deleteMatch(matchId) { if (confirm("この試合結果を削除しますか？")) { db.collection("matches").doc(matchId).delete(); } }
function editMatch(matchId) {
const target = allMatches.find(m => m.id === matchId);
if (target) {
document.getElementById('editingMatchId').value = target.id; document.getElementById('matchDate').value = target.rawDate; document.getElementById('opponentName').value = target.opponent; document.getElementById('scoreOpponent').value = target.scoreOpponent; document.getElementById('goalkeeper').value = target.gk === "ー" ? "" : target.gk; document.getElementById('matchType').value = target.matchType || "トレーニングマッチ"; toggleTournamentInput(); document.getElementById('tournamentName').value = target.tournamentName || ""; setScorersFieldsFromText(target.scorers);
document.getElementById('formTitle').innerText = "試合結果の訂正・編集"; document.getElementById('submitBtn').innerText = "🔧 修正内容を上書き保存する";
    document.getElementById('submitBtn').classList.remove('from-amber-500', 'to-amber-600'); document.getElementById('submitBtn').classList.add('from-sky-500', 'to-sky-600'); document.getElementById('cancelEditBtn').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
}
}
function cancelEdit() {
document.getElementById('editingMatchId').value = ""; initDateInput(); document.getElementById('scoreTakao').value = "0"; document.getElementById('opponentName').value = ""; document.getElementById('scoreOpponent').value = "0"; document.getElementById('goalkeeper').value = ""; document.getElementById('tournamentName').value = ""; document.getElementById('matchType').value = "トレーニングマッチ"; toggleTournamentInput(); initScorerFields();
document.getElementById('formTitle').innerText = "新しい試合の登録"; document.getElementById('submitBtn').innerText = "＋ 試合結果を追加する"; document.getElementById('submitBtn').classList.remove('from-sky-500', 'to-sky-600'); document.getElementById('submitBtn').classList.add('from-amber-500', 'to-amber-600'); document.getElementById('cancelEditBtn').classList.add('hidden');
}
function formatDate(dateStr) { if (!dateStr) return ""; const date = new Date(dateStr); return ${date.getMonth() + 1}月${date.getDate()}日 (${["日", "月", "火", "水", "木", "金", "土"][date.getDay()]}); }
